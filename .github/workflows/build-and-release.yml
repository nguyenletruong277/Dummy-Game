name: Build Godot Game

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.0"
  EXPORT_NAME: "among-us-lan"

jobs:
  export:
    name: Export Game
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux
            export-preset: "Linux"
            output-dir: linux
            output-file: "among-us-lan.x86_64"
          - platform: windows
            export-preset: "Windows Desktop"
            output-dir: windows
            output-file: "among-us-lan.exe"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Import project (first pass to build .godot cache)
        run: godot --headless --verbose --import

      - name: Create export dirs
        run: mkdir -p build/${{ matrix.output-dir }}

      - name: Export ${{ matrix.platform }}
        run: |
          godot --headless --export-release "${{ matrix.export-preset }}" \
            build/${{ matrix.output-dir }}/${{ matrix.output-file }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.EXPORT_NAME }}-${{ matrix.platform }}
          path: build/${{ matrix.output-dir }}
          retention-days: 7
  
  release:
    name: Create Release
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip builds
        run: |
          cd artifacts
          for dir in */; do
            zip -r "../${dir%/}.zip" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true